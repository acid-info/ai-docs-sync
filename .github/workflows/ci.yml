name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Consumers run these files straight from a tag -- a syntax error would break all of them.
      - run: node --check docs-sync.mjs
      - run: node --check lib.mjs
      - run: node --test 'test/**/*.test.mjs'
